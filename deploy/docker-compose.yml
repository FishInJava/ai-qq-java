services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: justrag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: justrag
      POSTGRES_USER: justrag
      POSTGRES_PASSWORD: justrag
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # 命名卷落在 Docker 数据目录，本机在 G:\0Docker\DockerDesktopWSL
      - justrag-pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_parallel_maintenance_workers=2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U justrag -d justrag"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  justrag-pgdata:
    name: justrag-pgdata
