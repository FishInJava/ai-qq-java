# 只监听本机
server.address=127.0.0.1
server.port=8090

# 本机私有配置（模型密钥），不进仓库；文件不存在也能启动
spring.config.import=optional:file:G:/aiqq-rag/config.properties

# 研报库：Postgres 17 + pgvector，容器 justrag-postgres（见 deploy/docker-compose.yml）
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/justrag}
spring.datasource.username=${DB_USER:justrag}
spring.datasource.password=${DB_PASSWORD:justrag}
spring.datasource.hikari.maximum-pool-size=8

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# 扫描根目录、上传落盘、Lucene 索引
rag.scan-root=${RAG_SCAN_ROOT:F:/研报}
rag.storage-root=${RAG_STORAGE_ROOT:G:/aiqq-rag/files}
rag.index-root=${RAG_INDEX_ROOT:G:/aiqq-rag/index}

# 生成模型：火山 Ark，OpenAI 兼容
rag.llm.base-url=https://ark.cn-beijing.volces.com/api/coding/v3
rag.llm.model=deepseek-v4-1-flash-261017
rag.llm.api-key=${ARK_API_KEY:}
rag.llm.temperature=0.2
rag.llm.max-tokens=1200
rag.llm.timeout-seconds=120
rag.llm.thinking=disabled

logging.file.name=${RAG_LOG_FILE:G:/aiqq-rag/logs/aiqq.log}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
